<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration System</title>
    <link href="./style.css" rel="stylesheet">
    <script src="./index.js" defer></script>
</head>

<body class="bg-slate-50 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-slate-800 mb-4">Student Registration Portal</h1>
            <p class="text-slate-600 max-w-2xl mx-auto">
                Welcome to the official enrollment form. Please ensure all details, especially the 
                <strong>Student ID</strong> and <strong>Roll Number</strong>, are accurate. 
            </p>
        </div>

        <div class="bg-white shadow-xl rounded-2xl overflow-hidden mb-12">
            <div class="bg-indigo-600 py-4 px-8">
                <h2 class="text-white text-xl font-semibold">Registration Form</h2>
            </div>
            
            <form id="studentForm" class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Full Student Name</label>
                    <input type="text" id="name" placeholder="e.g. John Doe" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Student ID</label>
                    <input type="text" id="studentID" placeholder="STU-2026-001" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Class (Grade)</label>
                    <input type="number" id="studentClass" min="1" max="12" placeholder="1-12" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Roll Number</label>
                    <input type="number" id="rollNo" min="1" max="40" placeholder="1-40" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="email" placeholder="student@example.com" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contact Number</label>
                    <input type="tel" id="contact" placeholder="+91 00000-00000" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Residential Address</label>
                    <textarea id="address" rows="3" placeholder="Enter complete address..." required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition"></textarea>
                </div>

                <div class="md:col-span-2">
                    <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-indigo-200 transition-all duration-200">
                        Register Student
                    </button>
                </div>
            </form>
        </div>

        <div class="bg-white shadow-lg rounded-2xl overflow-hidden">
            <div class="px-8 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-xl font-bold text-slate-800">Registered Students</h2>
                <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Local Records</span>
            </div>
            
            <div class="overflow-x-auto">
                <table id="studentTable" class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-sm uppercase">
                            <th class="px-6 py-4 font-semibold border-b">ID</th>
                            <th class="px-6 py-4 font-semibold border-b">Name</th>
                            <th class="px-6 py-4 font-semibold border-b">Class</th>
                            <th class="px-6 py-4 font-semibold border-b text-center">Roll No</th>
                            <th class="px-6 py-4 font-semibold border-b">Email</th>
                            <th class="px-6 py-4 font-semibold border-b">Contact</th>
                            <th class="px-6 py-4 font-semibold border-b">Address</th>
                        </tr>
                    </thead>
                    <tbody class="text-slate-600 divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
            <div id="emptyState" class="p-10 text-center text-slate-400 hidden">
                No students registered yet.
            </div>
        </div>
    </div>
</body>

</html>
